[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "eo-overpass-predictor"
version = "1.1.0.dev0"
description = "Swath-aware Landsat and Sentinel-2 overpass prediction and acquisition-plan verification"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Julian Manning", email = "julian.manning@outlook.com"}]
keywords = ["Landsat", "Sentinel-2", "SGP4", "overpass", "remote sensing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "numpy>=1.26", "pandas>=2.2", "geopandas>=1.0", "shapely>=2.0",
  "pyproj>=3.6", "skyfield>=1.49", "timezonefinder>=9.0,<9.1",
  "tzdata>=2024.1", "requests>=2.32", "typer>=0.16", "platformdirs>=4",
]

[project.optional-dependencies]
visualization = ["folium>=0.17", "matplotlib>=3.8"]
notebooks = [
  "folium>=0.17", "matplotlib>=3.8", "jupyterlab>=4", "ipykernel>=6",
  "ipyleaflet>=0.19", "ipywidgets>=8",
]

[project.scripts]
eo-overpass = "eo_overpass_predictor.cli:app"

[project.urls]
Homepage = "https://github.com/julianManning/eo-overpass-predictor"
Repository = "https://github.com/julianManning/eo-overpass-predictor"
Issues = "https://github.com/julianManning/eo-overpass-predictor/issues"
Citation = "https://doi.org/10.5281/zenodo.23629976"

[dependency-groups]
dev = [
  "pytest>=8", "ruff>=0.12", "mypy>=1.15", "pandas-stubs>=2.2",
  "types-requests>=2.32", "twine>=6", "nbformat>=5", "nbclient>=0.10",
  "ipykernel>=6", "pre-commit>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eo_overpass_predictor"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "notebooks", "docs", "README.md", "AGENTS.md", "LICENSE", "CITATION.cff", "pyproject.toml", "uv.lock", ".github", ".pre-commit-config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["notebooks: headless execution of example notebooks", "visualization: optional presentation dependencies"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F401"]

[tool.mypy]
files = ["src/eo_overpass_predictor/api.py", "src/eo_overpass_predictor/cli.py", "src/eo_overpass_predictor/presentation.py", "src/eo_overpass_predictor/types.py"]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
